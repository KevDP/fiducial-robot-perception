[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fiducial-robot-perception"
version = "0.1.0"
description = "Measuring where classical fiducial-marker detection breaks, and what recovers it"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Kevin Delgado" }]
dependencies = [
    "numpy>=1.26",
    "opencv-contrib-python==5.0.0.93",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "jupyter>=1.0", "ipykernel>=6.29"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
